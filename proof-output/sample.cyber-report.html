<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XPADI ProofCheck™ Cyber Report Surface</title>
<style>
:root{--bg:#05070d;--panel:rgba(14,22,36,.82);--line:rgba(107,224,255,.2);--cyan:#6be0ff;--orange:#ff9f43;--text:#edf7ff;--muted:#8ea5bb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:radial-gradient(circle at top left,rgba(107,224,255,.18),transparent 32%),linear-gradient(135deg,#03050a,#07111f 55%,#03050a);color:var(--text);min-height:100vh}.wrap{max-width:1050px;margin:0 auto;padding:38px 20px}.hero,.card{border:1px solid var(--line);background:var(--panel);border-radius:28px;padding:26px;box-shadow:0 28px 70px rgba(0,0,0,.32)}h1{font-size:44px;line-height:1;margin:10px 0}.k{color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800}.muted{color:var(--muted)}textarea{width:100%;min-height:260px;border-radius:18px;background:#050914;color:#dff6ff;border:1px solid var(--line);padding:16px;font-family:ui-monospace,Consolas,monospace}button{border:0;border-radius:999px;padding:13px 18px;background:linear-gradient(90deg,var(--cyan),var(--orange));font-weight:900;color:#06101b;cursor:pointer}.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.out{margin-top:18px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#02050a}iframe{width:100%;height:780px;border:0;background:white}.drop{border:1px dashed var(--line);border-radius:18px;padding:16px;color:var(--muted)}</style>
</head>
<body><div class="wrap"><section class="hero"><div class="k">XPADI ProofCheck™</div><h1>Cyber Proof Report Surface</h1><p class="muted">Paste a manifest JSON or upload one to render a local, screenshot-ready Recovery Intelligence report. No cloud required.</p></section><section class="card" style="margin-top:18px"><div class="drop"><input id="file" type="file" accept=".json,application/json" /> Upload manifest JSON</div><div class="row"><button id="sample">Load Sample</button><button id="render">Render Cyber Report</button><button id="download">Download HTML</button></div><textarea id="json" placeholder="Paste XPADI manifest JSON here..."></textarea></section><div class="out"><iframe id="preview"></iframe></div></div><script>
const ta=document.getElementById('json'), frame=document.getElementById('preview');let lastHtml='';
const sample={"proof_version":"XPADI-PC-V0.2-REPORT-SURFACE","proof_id":"XPADI-PC-20260506-B65B0E438C6DA0B9","created_at":"2026-05-06T16:55:01.397Z","subject":{"subject_type":"file","name":"README.md","size_bytes":2773,"file_count":1},"integrity":{"algorithm":"BLAKE3","digest":"b65b0e438c6da0b9492e9529b0bd66a5bb16d8f13e6e4ed84102aced9305f63f","status":"VERIFIED_AT_CREATION"},"survivability":{"recovery_readiness":19,"continuity_confidence":25,"single_point_dependency":"HIGH","reconstruction_readiness":"LOW","fragment_survivability":"LOW","recovery_complexity":"LOW","posture":"FRAGILE_RECOVERY_POSTURE","recovery_intelligence":["Single point dependency detected","No survivability distribution observed","Fragment survivability is structurally limited","Recovery pathway confidence is reduced"]},"fragment_profile":{"simulated_fragment_count":1,"simulated_fragment_size_bytes":65536,"entropy_signal":"NORMAL","diversity_signal":"SINGLE_OBJECT_DOMINANT","manifest_mode":"SIMULATED_PUBLIC_SAFE"},"notes":["Public-safe proof surface only; not a recovery engine.","Recovery Readiness estimates survivability posture, not guaranteed restoration.","Checksums prove change; ProofCheck asks whether data is structurally ready to survive failure."]};
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function sev(s){s=Number(s||0);return s<=25?'CRITICAL':s<=50?'WEAK':s<=75?'MODERATE':'STRONG'}
function reasons(m){let sv=m.survivability||{},p=m.fragment_profile||{},r=sv.recovery_intelligence||[];if(r.length)return r;if(sv.single_point_dependency==='HIGH')r.push('Single point dependency detected');if(p.diversity_signal==='SINGLE_OBJECT_DOMINANT')r.push('No survivability distribution observed');if((p.simulated_fragment_count||1)<4)r.push('Fragment survivability is structurally limited');return r.length?r:['Survivability posture shows distributed indicators']}function html(m){let sv=m.survivability||{},sub=m.subject||{},p=m.fragment_profile||{},ready=Number(sv.recovery_readiness||0),conf=Number(sv.continuity_confidence||0),rs=reasons(m).map(x=>`<li>${esc(x)}</li>`).join(''),notes=(m.notes||[]).map(x=>`<li>${esc(x)}</li>`).join('');return `<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:Inter,system-ui;background:radial-gradient(circle at 10% 0,rgba(107,224,255,.18),transparent 30%),#05070d;color:#edf7ff}.w{max-width:1120px;margin:0 auto;padding:34px}.hero,.c{border:1px solid rgba(107,224,255,.22);background:rgba(12,20,34,.86);border-radius:28px;padding:26px;margin:16px 0;box-shadow:0 30px 80px rgba(0,0,0,.35)}.k{color:#6be0ff;letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:900}h1{font-size:44px;margin:12px 0 8px}.muted{color:#91a4b8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.s{border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px;background:rgba(255,255,255,.04)}.n{font-size:44px;font-weight:950}.pill{display:inline-block;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:900}.CRITICAL{background:rgba(255,77,94,.22);border:1px solid rgba(255,77,94,.45)}.WEAK{background:rgba(255,159,67,.22);border:1px solid rgba(255,159,67,.45)}.MODERATE{background:rgba(107,224,255,.18);border:1px solid rgba(107,224,255,.4)}.STRONG{background:rgba(85,243,165,.18);border:1px solid rgba(85,243,165,.4)}li{margin:9px 0}code,pre{font-family:Consolas,monospace}.kv{display:grid;grid-template-columns:220px 1fr;gap:8px 12px}.kv div:nth-child(odd){color:#91a4b8}pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#02050a;border-radius:16px;padding:14px}</style></head><body><div class="w"><section class="hero"><div class="k">XPADI ProofCheck™</div><h1>Recovery Intelligence & Survivability Proof</h1><p class="muted">Checksums prove a file did not change. XPADI ProofCheck asks whether data is structurally ready to survive failure.</p><p><code>${esc(m.proof_id)}</code></p></section><section class="c"><div class="grid"><div class="s"><div class="muted">Recovery Readiness</div><div class="n">${ready}%</div><span class="pill ${sev(ready)}">${sev(ready)}</span></div><div class="s"><div class="muted">Continuity Confidence</div><div class="n">${conf}%</div><span class="pill ${sev(conf)}">${sev(conf)}</span></div><div class="s"><div class="muted">Posture</div><div style="font-size:24px;font-weight:950;margin-top:14px">${esc(sv.posture)}</div></div></div></section><section class="c"><h2>Recovery Intelligence</h2><ul>${rs}</ul></section><section class="c"><h2>Proof Layer</h2><div class="kv"><div>Subject</div><div>${esc(sub.name)}</div><div>Size</div><div>${esc(sub.size_bytes)} bytes</div><div>Integrity</div><div>${esc(m.integrity?.algorithm)}</div><div>Fragment Profile</div><div>${esc(p.diversity_signal)} / ${esc(p.simulated_fragment_count)} fragments</div></div></section><section class="c"><h2>Public-Safe Notes</h2><ul>${notes}</ul></section><section class="c"><h2>Manifest JSON</h2><pre>${esc(JSON.stringify(m,null,2))}</pre></section></div></body></html>`}
function render(){try{const m=JSON.parse(ta.value);lastHtml=html(m);frame.srcdoc=lastHtml}catch(e){alert('Invalid manifest JSON: '+e.message)}}document.getElementById('sample').onclick=()=>{ta.value=JSON.stringify(sample,null,2);render()};document.getElementById('render').onclick=render;document.getElementById('download').onclick=()=>{if(!lastHtml)render();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lastHtml],{type:'text/html'}));a.download='xpadi-proofcheck-report.html';a.click()};document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(f){ta.value=await f.text();render()}};ta.value=JSON.stringify(sample,null,2);render();</script></body></html>
